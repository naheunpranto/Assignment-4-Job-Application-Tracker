<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">

    <!-- Header section -->
    <header class="w-[80%] mx-auto">
        <h1 class="text-[32px] font-bold">Job Application Tracker</h1>
        <div class="grid grid-cols-3 gap-[16px]">
            <div class="bg-white p-4 rounded-md">
                <p class="text-[14px] font-[500]">Total</p>
                <p id="total" class="text-[24px] font-[700]">0</p>
            </div>

            <div class="bg-white p-4 rounded-md">
                <p class="text-[14px] font-[500]">Interview</p>
                <p id="Interview" class="text-[24px] font-[700] text-green-500">0</p>
            </div>

            <div class="bg-white p-4 rounded-md">
                <p class="text-[14px] font-[500]">Rejected</p>
                <p id="rejected" class="text-[24px] font-[700] text-red-500">0</p>
            </div>
        </div>
    </header>

    <hr class="my-5">

    <!-- Available Jobs Section -->
    <main class="w-[80%] mx-auto mt-[30px]">
        <h2 class="text-[20px] font-[600] mb-[24px]">Available Jobs</h2>
        <div class="flex gap-[8px]">
            <button class="bg-white px-5 py-2 text-gray-500 hover:bg-blue-500 hover:text-white" id="all-filter-btn">All</button>
            <button class="bg-white px-5 py-2 text-gray-500 hover:bg-blue-500 hover:text-white" id="interview-filter-btn">Interview</button>
            <button class="bg-white px-5 py-2 text-gray-500 hover:bg-blue-500 hover:text-white" id="rejected-filter-btn">Rejected</button>
        </div>
    </main>
</body>
</html>
